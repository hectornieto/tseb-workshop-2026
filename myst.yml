version: 1
project:
  title: International Workshop Two Source Thermal Remote Sensing For the Management of agricultural systems
  description: Application of publicly available Python version PyTSEB using formulations in GitHub
  keywords:
      - MyST Markdown
      - pyTSEB
      - py3SEB
      - ProspectD
      - 4SAIL
      - Remote Sensing
      - Copernicus
  authors:
      - name: Vicente Burchard-Levine
        affiliation: 
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0003-0222-8706
        email: vburchard@ica.csic.es
      - name: Héctor Nieto
        affiliation: 
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0003-4250-6424
        email: hector.nieto@ica.csic.es
      - name: Benjamin Mary
        affiliation:
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0003-0815-842X
       - name: Radoslaw Guzinski
         affiliations:
           - DHI
         orcid: 0000-0003-0044-6806
  open_access: true
  license:
    content: CC-BY-4.0
  toc:
    - file: intro.md
    - file: ./101-TSEB_3SEB_introduction.md
    - file: theory.md
      children:
        - file: ./201-Net_radiation.md
        - file: ./202-Turbulence_and_sensible_heat_flux.md
        - file: ./203-Net_radiation_calculation.md
   
        
  
  Options:
    logo: ./input/figures/logo.png

  github: https://github.com/hectornieto/tseb-workshop-2026
  jupyter:
    execute: true
    binder:
      repo: https://github.com/hectornieto/tseb-workshop-2026
  settings:
    output_matplotlib_strings: remove
    output_stderr: remove-warn 
    
  exports:
    - format: typst
      template: plain_typst_book 
      output: tseb-workshop-2026.pdf
      cover: ./input/figures/logo.png
      logo: ./input/figures/logo.png
      logo_width: 20
      Logoposition: right

      article:
        - file: intro.md
        - file: ./201-Net_radiation.md
        - file: ./202-Turbulence_and_sensible_heat_flux.md
        - file: ./101-TSEB_3SEB_introduction.md
        - file: ./203-Net_radiation_calculation.md
         
    - format: cff
 
          
  bibliography: 
   - bibliography.bib
site:
  template: book-theme
  title: International Workshop Two Source Thermal Remote Sensing For the Management of agricultural systems
  options:
    logo_text: TSEB & Sen-ET
    logo: ./input/figures/logo.png
  nav: []
  actions:
    - title: Learn More
      url: https://mystmd.org/guide
  domains: []
